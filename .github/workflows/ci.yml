name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "22 1 * * 5"
  workflow_dispatch:
    inputs:
      publish_release:
        description: >-
          Treat this dispatch as if release-please had cut a release. Runs the
          Publish draft release + Publish release jobs against the existing
          tag from .release-please-manifest.json. Use for emergency rebuilds
          of a tag whose initial pipeline run failed.
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PRs cancel in-progress to save runner time; pushes to main (release flow)
  # are not cancelled so a fast follow-up push doesn't abort a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================
  # Fast checks (PR + push + dispatch; skipped on schedule)
  # ============================================================
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./operations/pipelines/install-deps
      - name: Run oxlint
        run: pnpm run lint

  typecheck:
    name: Typecheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./operations/pipelines/install-deps
      - name: Run tsc --noEmit
        run: pnpm run typecheck

  test:
    name: Unit Tests and Coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./operations/pipelines/install-deps
      - name: Run vitest with coverage
        run: pnpm run test:coverage

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Coverage summary"
            echo
            echo "| package | statements | branches | functions | lines |"
            echo "|---|---:|---:|---:|---:|"
            for f in packages/*/coverage/coverage-summary.json; do
              [ -f "$f" ] || continue
              pkg=$(echo "$f" | cut -d/ -f2)
              s=$(jq -r '.total.statements.pct' "$f")
              b=$(jq -r '.total.branches.pct' "$f")
              fn=$(jq -r '.total.functions.pct' "$f")
              l=$(jq -r '.total.lines.pct' "$f")
              printf '| %s | %s%% | %s%% | %s%% | %s%% |\n' "$pkg" "$s" "$b" "$fn" "$l"
            done
          } | tee /tmp/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(cat /tmp/coverage.md)$'\n\n<!-- coverage-bot -->'
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- coverage-bot -->")) | .id' 2>/dev/null | head -1 || true)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$BODY" > /dev/null
          else
            gh pr comment "$PR" --body "$BODY"
          fi

      - if: always()
        name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: packages/*/coverage/
          if-no-files-found: warn

  build:
    name: Build
    if: github.event_name != 'schedule'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./operations/pipelines/install-deps
      - name: Build web + generator + SBOM
        uses: ./operations/pipelines/build-bundle

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.run_id }}
          # upload-artifact roots the archive at the least common ancestor of
          # these paths, so entries land at generator/... and web/... with the
          # `packages/` prefix stripped. Consumers must use that stripped path
          # (see sbom-scan's bom-path). Adding a path outside packages/ moves
          # the root back to the repo root and silently breaks them.
          path: |
            packages/web/dist/
            packages/generator/dist-api/
            packages/generator/sbom/sbom.cdx.json
          if-no-files-found: error

  ui-tests:
    name: UI Tests
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./operations/pipelines/install-deps
      - name: Run Playwright against a local build
        uses: ./operations/pipelines/test-pdt
        with:
          mode: ui

  api-tests:
    name: API Tests
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./operations/pipelines/install-deps
      - name: Run Bruno against a local build
        uses: ./operations/pipelines/test-pdt
        with:
          mode: api

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:javascript-typescript"

      - name: Post CodeQL results to PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          alerts=$(gh api "repos/${REPO}/code-scanning/alerts?ref=${REF}&state=open&per_page=100" 2>/dev/null || echo '[]')
          count=$(jq 'length' <<<"$alerts")
          critical=$(jq '[.[] | select(.rule.security_severity_level == "critical")] | length' <<<"$alerts")
          high=$(jq     '[.[] | select(.rule.security_severity_level == "high")]     | length' <<<"$alerts")
          medium=$(jq   '[.[] | select(.rule.security_severity_level == "medium")]   | length' <<<"$alerts")
          low=$(jq      '[.[] | select(.rule.security_severity_level == "low" or (.rule.security_severity_level | not))] | length' <<<"$alerts")

          icon=':white_check_mark:'
          if [ $((critical + high)) -gt 0 ]; then icon=':x:'; fi

          body="## $icon CodeQL Security Scan"$'\n\n'
          if [ "$count" -eq 0 ]; then
            body+=':tada: **No security alerts found.**'$'\n'
          else
            body+="**$count alert(s) found:**"$'\n\n'
            [ "$critical" -gt 0 ] && body+=":red_circle: **$critical critical** "
            [ "$high" -gt 0 ]     && body+=":orange_circle: **$high high** "
            [ "$medium" -gt 0 ]   && body+=":yellow_circle: **$medium medium** "
            [ "$low" -gt 0 ]      && body+=":white_circle: **$low low/note** "
            body+=$'\n\n| Severity | Rule | File | Message |\n|---|---|---|---|\n'
            rows=$(jq -r '
              sort_by(.rule.security_severity_level) | .[] |
              {
                sev: (
                  if   .rule.security_severity_level == "critical" then ":red_circle: Critical"
                  elif .rule.security_severity_level == "high"     then ":orange_circle: High"
                  elif .rule.security_severity_level == "medium"   then ":yellow_circle: Medium"
                  else ":white_circle: Low" end
                ),
                rule: .rule.id,
                file: (.most_recent_instance.location.path // ""),
                line: (.most_recent_instance.location.start_line // 0),
                msg: ((.most_recent_instance.message.text | gsub("[\r\n]+"; " ")) | .[0:100])
              } |
              "| \(.sev) | `\(.rule)` | `\(.file)`\(if .line > 0 then "#L\(.line)" else "" end) | \(.msg) |"
            ' <<<"$alerts")
            body+="$rows"$'\n'
          fi
          body+=$'\n<!-- codeql-bot -->'

          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate --jq '.[] | select(.body | contains("<!-- codeql-bot -->")) | .id' 2>/dev/null | head -1 || true)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body "$body"
          fi

  # ============================================================
  # PR-only: SBOM + DT scan with HTML report + gate
  # ============================================================
  sbom-scan:
    name: SBOM + DT scan
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      contents: read
      pull-requests: write
    env:
      DT_HOST: ${{ secrets.DT_HOST }}
      DT_API_KEY: ${{ secrets.DT_API_KEY }}
      DT_DOMAIN: portfolio
      DT_SYSTEM: hoobi-portfolio
      DT_COMPONENT: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The source SBOM was already generated in the `build` job (there's no
      # runtime image to add a second scan pass for). Reuse that artefact.
      - name: Download build artifact
        if: env.DT_HOST != '' && env.DT_API_KEY != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ github.run_id }}
          path: build-artifact

      - name: Upload SBOM to Dependency-Track (channel=pr)
        if: env.DT_HOST != '' && env.DT_API_KEY != ''
        uses: hoobio/pipeline-tools/pipeline/github/job/upload-sbom-to-dependency-track@e751f36b5c779fb2884a0ca37bf18688346c5104 # v2.3.1
        with:
          bom-path: build-artifact/generator/sbom/sbom.cdx.json
          upload-artifact: 'false'
          server-url: https://${{ env.DT_HOST }}
          api-key: ${{ env.DT_API_KEY }}
          domain: ${{ env.DT_DOMAIN }}
          system: ${{ env.DT_SYSTEM }}
          component: ${{ env.DT_COMPONENT }}
          channel: pr
          default-branch: main
          project-version: pr-${{ github.event.pull_request.number }}
          project-tags: repo=${{ github.repository }},pr=${{ github.event.pull_request.number }},commit=${{ github.sha }}
          mark-latest: false
          prune-stale-children: true
          keep: '10'
          ci-keep: '3'
          wait-for-processing: 'true'

      - name: DT findings + PR gate
        if: env.DT_HOST != '' && env.DT_API_KEY != ''
        uses: hoobio/pipeline-tools/pipeline/github/step/dt-findings-pr-gate@e751f36b5c779fb2884a0ca37bf18688346c5104 # v2.3.1
        with:
          server-url: https://${{ env.DT_HOST }}
          api-key: ${{ env.DT_API_KEY }}
          project-name: ${{ env.DT_COMPONENT }}
          project-version: pr-${{ github.event.pull_request.number }}
          fail-on-severity: critical
          gate-mode: error
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          github-token: ${{ github.token }}
          html-output-path: dt-findings.html
          artifact-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bom-path: build-artifact/generator/sbom/sbom.cdx.json

      - name: Upload HTML findings report
        if: always() && env.DT_HOST != '' && env.DT_API_KEY != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dt-findings
          path: dt-findings.html
          if-no-files-found: warn

  # ============================================================
  # Release flow (push to main, or workflow_dispatch)
  # ============================================================
  release-please:
    name: Release Please
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Failure here (e.g. unparseable commit messages) should not block a
    # workflow_dispatch deploy. Downstream jobs gate on this output but
    # tolerate the job itself failing.
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub App token so the release PR is authored by the App, not
      # github-actions[bot]. PRs from the default GITHUB_TOKEN don't trigger
      # downstream workflow runs (anti-recursion), so required checks never
      # fire. The App token is unaffected.
      - name: Run release-please with App token
        id: rp
        uses: hoobio/pipeline-tools/pipeline/github/step/release-please@e751f36b5c779fb2884a0ca37bf18688346c5104 # v2.3.1
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please populates tag/version when it cuts a release. For
      # publish_release dispatches (rebuild an existing tag whose first run
      # failed), fall back to the manifest version.
      - id: version
        shell: bash
        env:
          RP_TAG: ${{ steps.rp.outputs.tag_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [ -n "${RP_TAG:-}" ]; then
            echo "tag=$RP_TAG" >> "$GITHUB_OUTPUT"
            echo "value=${RP_TAG#v}" >> "$GITHUB_OUTPUT"
          elif [ "${PUBLISH_RELEASE:-false}" = "true" ]; then
            v=$(jq -r '."."' .release-please-manifest.json)
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
            echo "value=$v" >> "$GITHUB_OUTPUT"
          fi

  generate-sbom:
    name: Generate SBOM
    needs: [release-please, lint, typecheck, test, build, ui-tests, api-tests, codeql]
    if: |
      always()
      && needs.lint.result == 'success'
      && needs.typecheck.result == 'success'
      && needs.test.result == 'success'
      && needs.build.result == 'success'
      && needs.ui-tests.result == 'success'
      && needs.api-tests.result == 'success'
      && needs.codeql.result == 'success'
      && (
        needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.release-please.outputs.version }}
    env:
      DT_HOST: ${{ secrets.DT_HOST }}
      DT_API_KEY: ${{ secrets.DT_API_KEY }}
      DT_DOMAIN: portfolio
      DT_SYSTEM: hoobi-portfolio
      DT_COMPONENT: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./operations/pipelines/install-deps

      # Same source-based scan build-bundle already runs in `build` - a fresh
      # scan here keeps this job self-contained rather than reaching across
      # jobs for an artifact just to re-derive the version below.
      - name: Build CycloneDX SBOM (source scan)
        uses: hoobio/pipeline-tools/pipeline/github/step/build-cyclonedx-sbom@e751f36b5c779fb2884a0ca37bf18688346c5104 # v2.3.1
        with:
          app-language: node
          app-manifest-path: .
          scan-github-actions-path: .github/workflows
          output-path: packages/generator/sbom/sbom.cdx.json

      - name: Upload SBOM artifact (for release attachment + deploy job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: packages/generator/sbom/sbom.cdx.json
          if-no-files-found: error

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: packages/generator/sbom/sbom.cdx.json
          sbom-path: packages/generator/sbom/sbom.cdx.json

      - name: Upload SBOM to Dependency-Track
        if: env.DT_HOST != '' && env.DT_API_KEY != ''
        uses: hoobio/pipeline-tools/pipeline/github/job/upload-sbom-to-dependency-track@e751f36b5c779fb2884a0ca37bf18688346c5104 # v2.3.1
        with:
          bom-path: packages/generator/sbom/sbom.cdx.json
          upload-artifact: 'false'
          server-url: https://${{ env.DT_HOST }}
          api-key: ${{ env.DT_API_KEY }}
          domain: ${{ env.DT_DOMAIN }}
          system: ${{ env.DT_SYSTEM }}
          component: ${{ env.DT_COMPONENT }}
          channel: ${{ (needs.release-please.outputs.release_created == 'true' || inputs.publish_release == true) && 'release' || 'main' }}
          default-branch: main
          project-version: ${{ needs.release-please.outputs.version }}
          project-tags: repo=${{ github.repository }},commit=${{ github.sha }},run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mark-latest: ${{ needs.release-please.outputs.release_created == 'true' || inputs.publish_release == true }}
          prune-stale-children: ${{ needs.release-please.outputs.release_created != 'true' && inputs.publish_release != true }}
          keep: '10'
          ci-keep: '3'

      - name: Pull DT findings
        id: findings
        if: env.DT_HOST != '' && env.DT_API_KEY != ''
        continue-on-error: true
        uses: ./operations/pipelines/dt-findings
        with:
          dt-host: ${{ env.DT_HOST }}
          dt-api-key: ${{ env.DT_API_KEY }}
          project-name: ${{ env.DT_COMPONENT }}
          project-version: ${{ needs.release-please.outputs.version }}

      - name: Upload findings artifact
        if: steps.findings.outputs.findings-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings
          path: ${{ steps.findings.outputs.findings-path }}
          if-no-files-found: warn

  publish-draft-release:
    name: Publish draft release
    needs: [release-please, generate-sbom]
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release

      - name: Attach SBOM to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/sbom.cdx.json --clobber --repo "${{ github.repository }}"

      # The full trust signal (with linked CodeQL run) is composed in
      # publish-release. Here we add a "verification pending" marker so the
      # draft is never published without explicit verification.
      - name: Provisional trust signal (pre-CodeQL)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq '.body // ""')
          TRUST=$'\n\n---\n'
          TRUST+="> ⏳ Verification pending (deploy + CodeQL). Release stays in draft until verified."
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "${BODY}${TRUST}"

  deploy:
    name: Deploy to Azure
    needs: [release-please, generate-sbom, publish-draft-release]
    if: |
      always() && needs.generate-sbom.result == 'success' && (
        needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    environment: azure
    outputs:
      static-site-default-hostname: ${{ steps.deploy.outputs.static-site-default-hostname }}
      api-base-url: ${{ steps.deploy.outputs.api-base-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: packages/generator/sbom

      - name: Download DT findings (optional)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: findings
          path: packages/generator/sbom

      - name: Install dependencies
        uses: ./operations/pipelines/install-deps

      - name: Build site (schemas + generator + web)
        shell: bash
        env:
          APP_VERSION: ${{ needs.generate-sbom.outputs.version }}
          GIT_SHA: ${{ github.sha }}
          PUBLIC_BASE_URL: https://hoobi.dev
          API_BASE_URL: https://api.hoobi.dev/portfolio
        run: |
          set -euo pipefail
          # Deterministic per commit, so a re-run of a failed deploy for the
          # same release doesn't bust every blob's cache with a fresh "now".
          # $GITHUB_ENV only takes effect for later steps, not this one - so
          # export it directly instead.
          export BUILD_TIMESTAMP="$(git show -s --format=%cI HEAD)"
          pnpm run build

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: deploy
        uses: ./operations/pipelines/deploy-bicep
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP || 'portfolio' }}
          parameters-file: operations/variables/prod.bicepparam
          template-file: operations/provision/main.bicep

      - name: Upload static API to Blob Storage
        uses: ./operations/pipelines/upload-api-blobs
        with:
          account-name: ${{ steps.deploy.outputs.api-storage-account }}

      - name: Deploy Static Web App
        uses: ./operations/pipelines/deploy-swa
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP || 'portfolio' }}
          site-name: ${{ steps.deploy.outputs.static-site-name }}

  pdt-prod:
    name: PDT (Production)
    needs: deploy
    if: always() && needs.deploy.result == 'success' && needs.deploy.outputs.static-site-default-hostname != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./operations/pipelines/install-deps
      - name: Run PDT against production
        uses: ./operations/pipelines/test-pdt
        with:
          base-url: https://${{ needs.deploy.outputs.static-site-default-hostname }}
          api-base-url: ${{ needs.deploy.outputs.api-base-url }}
          mode: all

  publish-release:
    name: Publish release
    needs: [release-please, generate-sbom, codeql, pdt-prod]
    if: |
      always()
      && needs.codeql.result == 'success'
      && needs.pdt-prod.result == 'success'
      && (
        needs.release-please.outputs.release_created == 'true' ||
        inputs.publish_release == true
      )
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can't edit App-created resources (the draft release was
      # authored by the release-please App), so mint an App token here too.
      - name: Mint release-please App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve CodeQL run URL
        id: codeql-url
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # CodeQL ran as a sibling job in this same workflow. Look it up by
          # head_sha so the trust signal links to it.
          run=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&per_page=100" \
            --jq '.workflow_runs[] | select(.name=="CI") | {id, conclusion}' | head -1)
          # The CI run id is the current run; the CodeQL job inside it is what
          # we want to link to. Use the current run page (it shows all jobs).
          echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Compose final trust signal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          CODEQL_URL: ${{ steps.codeql-url.outputs.url }}
          CODEQL_ID: ${{ steps.codeql-url.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          SBOM_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/sbom.cdx.json"
          # Strip the provisional footer (everything from the first `---` line
          # onwards) so we replace it cleanly.
          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq '.body // ""' \
            | awk '/^---$/{exit} {print}')
          TRUST=$'\n\n---\n'
          TRUST+="> 🌐 Live: [hoobi.dev](https://hoobi.dev) · API: [api.hoobi.dev](https://api.hoobi.dev/portfolio/portfolio.json)"$'\n'
          TRUST+="> 📦 [SBOM (CycloneDX)](${SBOM_URL}) · attested · uploaded to Dependency-Track"$'\n'
          TRUST+="> 🛡️ [CodeQL run #${CODEQL_ID}](${CODEQL_URL}) — success"
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "${BODY}${TRUST}"

      - name: Mark draft release as live
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
