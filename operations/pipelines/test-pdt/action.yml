name: PDT - Playwright + Bruno
description: |
  Production Deployment Tests. Runs Playwright UI tests and Bruno API tests.

  - `base-url` set -> runs the `remote` projects against `base-url` (site)
    and `api-base-url` (API). Used for post-deploy tests against a live URL.
  - `base-url` unset -> builds the site and runs the `local` projects
    against `vite preview`, via the root `test:e2e` / `test:api` scripts
    (which already handle the full build + preview + teardown lifecycle).

  `mode` controls which suite(s) run: `ui` (Playwright only), `api` (Bruno
  only), or `all` (both, default).

inputs:
  base-url:
    description: Remote site URL to test (omit for a local vite-preview run)
    required: false
    default: ''
  api-base-url:
    description: Remote API base URL to test (required when base-url is set)
    required: false
    default: ''
  install-playwright-browsers:
    description: Run `playwright install --with-deps`
    required: false
    default: 'true'
  mode:
    description: Which suite to run (ui | api | all)
    required: false
    default: 'all'

runs:
  using: composite
  steps:
    - name: Install Playwright browsers
      if: ${{ (inputs.mode == 'ui' || inputs.mode == 'all') && inputs.install-playwright-browsers == 'true' }}
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Playwright UI tests
      if: ${{ inputs.mode == 'ui' || inputs.mode == 'all' }}
      shell: bash
      env:
        PLAYWRIGHT_BASE_URL: ${{ inputs.base-url }}
        API_BASE_URL: ${{ inputs.api-base-url }}
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.base-url }}" ]; then
          pnpm exec playwright test --project=remote
        else
          pnpm run test:e2e
        fi

    - name: Bruno API tests
      if: ${{ inputs.mode == 'api' || inputs.mode == 'all' }}
      shell: bash
      env:
        SITE_BASE_URL: ${{ inputs.base-url }}
        API_BASE_URL: ${{ inputs.api-base-url }}
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.base-url }}" ]; then
          (cd tests/api && pnpm exec bru run . --env remote) 2>&1 | tee bruno-output.txt
        else
          pnpm run test:api 2>&1 | tee bruno-output.txt
        fi

    - name: Upload Playwright report
      if: ${{ always() && (inputs.mode == 'ui' || inputs.mode == 'all') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}
        path: playwright-report/
        if-no-files-found: ignore
