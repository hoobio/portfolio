name: Build site bundle + SBOM
description: >-
  Generates the source CycloneDX SBOM, then builds schemas + generator + web.
  The SBOM must exist before the build runs - the generator bakes it into
  sbom.json.

outputs:
  sbom-path:
    description: Path to the generated CycloneDX SBOM
    value: packages/generator/sbom/sbom.cdx.json

runs:
  using: composite
  steps:
    # pnpm-lock.yaml drives the npm component list (via syft's
    # javascript-lock-cataloger); scan-github-actions-path adds the actions
    # this repo's workflows reference. Source-only now - there's no runtime
    # container to add an OS layer to.
    - uses: hoobio/pipeline-tools/pipeline/github/step/build-cyclonedx-sbom@e751f36b5c779fb2884a0ca37bf18688346c5104 # v2.3.1
      with:
        app-language: node
        app-manifest-path: .
        scan-github-actions-path: .github/workflows
        output-path: packages/generator/sbom/sbom.cdx.json

    - name: pnpm run build
      shell: bash
      run: pnpm run build

    - name: Build summary
      shell: bash
      run: |
        {
          echo "## Build artifacts"
          echo
          du -sh packages/web/dist 2>/dev/null | awk '{print "- site bundle: " $0}'
          du -sh packages/generator/dist-api 2>/dev/null | awk '{print "- API payload: " $0}'
          if [ -f packages/generator/sbom/sbom.cdx.json ]; then
            count=$(jq '.components | length' packages/generator/sbom/sbom.cdx.json 2>/dev/null || echo unknown)
            echo "- SBOM components: $count"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
