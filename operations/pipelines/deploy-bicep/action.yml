name: Deploy Bicep (resource-group scope)
description: Runs `az deployment group create` against the portfolio Bicep template.

inputs:
  resource-group:
    description: Target resource group name (must already exist)
    required: true
  parameters-file:
    description: Path to the .bicepparam file
    required: true
  template-file:
    description: Path to main.bicep
    required: true

outputs:
  static-site-name:
    description: Static Web App resource name
    value: ${{ steps.deploy.outputs.static-site-name }}
  static-site-default-hostname:
    description: Static Web App default hostname (*.azurestaticapps.net)
    value: ${{ steps.deploy.outputs.static-site-default-hostname }}
  api-storage-account:
    description: Name of the storage account fronting the API
    value: ${{ steps.deploy.outputs.api-storage-account }}
  api-base-url:
    description: Base URL for the published API (custom domain, already live)
    value: ${{ steps.deploy.outputs.api-base-url }}

runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        PARAMS_FILE: ${{ inputs.parameters-file }}
        TEMPLATE_FILE: ${{ inputs.template-file }}
      run: |
        set -euo pipefail

        az deployment group create \
          --resource-group "$RESOURCE_GROUP" \
          --name "hoobi-portfolio-$(date +%s)" \
          --template-file "$TEMPLATE_FILE" \
          --parameters "$PARAMS_FILE" \
          --query 'properties.outputs' \
          -o json | tee deployment-outputs.json

        SITE_NAME=$(jq -r '.staticSiteName.value' deployment-outputs.json)
        SITE_HOSTNAME=$(jq -r '.staticSiteDefaultHostname.value' deployment-outputs.json)
        STORAGE=$(jq -r '.apiStorageAccountName.value' deployment-outputs.json)
        API_BASE_URL=$(jq -r '.apiBaseUrl.value' deployment-outputs.json)
        {
          echo "static-site-name=$SITE_NAME"
          echo "static-site-default-hostname=$SITE_HOSTNAME"
          echo "api-storage-account=$STORAGE"
          echo "api-base-url=$API_BASE_URL"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## Deployment"
          echo
          echo "- Static Web App: $SITE_NAME (https://$SITE_HOSTNAME)"
          echo "- API storage account: $STORAGE"
          echo "- API base URL: $API_BASE_URL"
        } >> "$GITHUB_STEP_SUMMARY"
